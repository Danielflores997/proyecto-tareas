<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ tarea.titulo }}</title>
</head>
<body>
    <h1>{{ tarea.titulo }}</h1>

    <p><strong>Descripción:</strong> {{ tarea.descripcion }}</p>
    <p><strong>Responsable:</strong> {{ tarea.responsable }}</p>
    <p><strong>Estado:</strong> {{ tarea.get_estado_display }}</p>

    <p><a href="{% url 'editar_tarea' tarea.pk %}">Editar tarea</a></p>
    <p><a href="{% url 'eliminar_tarea' tarea.pk %}">Eliminar tarea</a></p>
    <a href="{% url 'lista_tareas' %}">Volver a la lista</a>
</body>
</html>
