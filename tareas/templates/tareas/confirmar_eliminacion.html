<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar tarea</title>
</head>
<body>
    <h1>Eliminar tarea</h1>
    <p>¿Seguro que deseas eliminar la tarea "{{ tarea.titulo }}"?</p>

    <form method="post">
        {% csrf_token %}
        <button type="submit">Sí, eliminar</button>
    </form>

    <p><a href="{% url 'detalle_tarea' tarea.pk %}">Cancelar</a></p>
</body>
</html>
