# Render Blueprint: Django + microservicio Node.js + PostgreSQL (plan gratuito).
# La base de datos gratuita de Render tiene limite de 30 dias.
services:
  - type: web
    name: gestor-tareas-uninpahu
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gestor-tareas-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: PORT
        value: "10000"
      - key: ALLOWED_HOSTS
        value: "localhost,127.0.0.1"
      # Superusuario para /admin (el plan gratis de Render no tiene shell).
      # La contrasena NO se escribe aqui: se ingresa en el panel de Render.
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@example.com
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      # Microservicio Node.js de IA. Pega aqui la URL publica de gestor-tareas-ia
      # (https://....onrender.com) y la MISMA clave definida en SERVICE_API_KEY.
      - key: NODE_SERVICE_URL
        sync: false
      - key: NODE_SERVICE_API_KEY
        sync: false

  # Microservicio Node.js: Swagger en /api-docs, health en /health
  - type: web
    name: gestor-tareas-ia
    runtime: docker
    plan: free
    dockerfilePath: ./microservicio-ia/Dockerfile
    dockerContext: ./microservicio-ia
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "10000"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_FALLBACK_MODEL
        value: gemini-3.5-flash
      # Se piden en el panel de Render; nunca se guardan en el repositorio.
      - key: SERVICE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false

databases:
  - name: gestor-tareas-db
    plan: free
    databaseName: gestor_tareas
    user: gestor_tareas
